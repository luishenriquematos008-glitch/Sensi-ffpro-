<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENSI FF PRO</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        body{background:#0f0f1a;color:#fff;padding:20px;min-height:100vh;}
        .container{max-width:500px;margin:0 auto;}
        h1{text-align:center;color:#ff003c;margin-bottom:30px;}
        .card{background:#1a1a2e;padding:20px;border-radius:12px;margin-bottom:15px;}
        label{display:block;margin:12px 0 5px;color:#ccc;}
        select,input{width:100%;padding:10px;border-radius:6px;border:none;background:#2a2a4a;color:#fff;font-size:16px;}
        button{background:#ff003c;color:#fff;border:none;padding:15px;font-size:18px;font-weight:bold;border-radius:8px;width:100%;cursor:pointer;margin-top:10px;}
        button:hover{background:#cc0030;}
        button.verde{background:#00b894;}
        button.verde:hover{background:#009677;}
        .resultado{background:#1a1a2e;padding:20px;border-radius:12px;margin-top:20px;display:none;}
        .resultado.mostrar{display:block;}
        .linha{padding:10px 0;border-bottom:1px solid #333;display:flex;justify-content:space-between;}
        .valor{color:#ff003c;font-weight:bold;}
        .aviso{background:rgba(255,193,7,0.1);border:1px solid #ffc107;border-radius:6px;padding:12px;margin-top:20px;font-size:14px;color:#ffd700;line-height:1.5;}
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 SENSI FF PRO</h1>

        <div class="card">
            <label>Seu Celular:</label>
            <select id="celular">
                <option value="g04s" selected>Moto G04s</option>
                <option value="g04">Moto G04</option>
                <option value="samsung">Samsung A05/A05s</option>
                <option value="xiaomi">Redmi 12C/13C</option>
            </select>

            <label>Arma Principal:</label>
            <select id="arma">
                <option value="todas" selected>Todas</option>
                <option value="eiac80">Carabina EIAC 80</option>
                <option value="m1014">M1014</option>
                <option value="mp40">MP40</option>
            </select>

            <label>Estilo de Jogo:</label>
            <select id="estilo">
                <option value="misto" selected>Misto</option>
                <option value="capa">Só Capa</option>
                <option value="rush">Rush</option>
            </select>

            <label>DPI:</label>
            <input type="number" id="dpi" value="708">
        </div>

        <button onclick="gerarSensi()">🚀 GERAR MINHA SENSI</button>

        <div class="resultado" id="caixaSensi">
            <h3 style="color:#00ff88;margin-bottom:15px;">✅ Sua Sensi Pronta!</h3>
            
            <div class="linha">DPI: <span class="valor" id="r-dpi">708</span></div>
            <div class="linha">Geral: <span class="valor" id="r-geral">195</span></div>
            <div class="linha">Ponto Vermelho: <span class="valor" id="r-ponto">190</span></div>
            <div class="linha">Mira 2x: <span class="valor" id="r-m2">180</span></div>
            <div class="linha">Mira 4x: <span class="valor" id="r-m4">165</span></div>
            <div class="linha">Sniper: <span class="valor" id="r-sniper">100</span></div>
            
            <h4 style="margin:15px 0 8px;color:#00ccff;">🔫 Por Arma:</h4>
            <div class="linha">EIAC 80: <span class="valor" id="r-eiac">191</span></div>
            <div class="linha">M1014: <span class="valor" id="r-m1014">205</span></div>

            <div class="aviso">
                ⚠️ Sempre teste no modo Treino primeiro! Ajuste de 2 em 2 pontos até achar o que funciona melhor pra você.
            </div>
        </div>

        <button class="verde" onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆️ Voltar ao topo</button>
    </div>

    <script>
        function gerarSensi(){
            const estilo = document.getElementById('estilo').value;
            const dpi = parseInt(document.getElementById('dpi').value) || 708;
            
            let geral = 195, ponto = 190, m2 = 180, m4 = 165, sniper = 100;
            let eiac = 191, m1014val = 205;
            
            if(estilo === 'capa'){
                geral = 198; ponto = 195; m2 = 185; m4 = 170;
                eiac = 194; m1014val = 208;
            } else if(estilo === 'rush'){
                geral = 185; ponto = 188; m2 = 175; m4 = 160;
                eiac = 186; m1014val = 198;
            }

            document.getElementById('r-dpi').textContent = dpi;
            document.getElementById('r-geral').textContent = geral;
            document.getElementById('r-ponto').textContent = ponto;
            document.getElementById('r-m2').textContent = m2;
            document.getElementById('r-m4').textContent = m4;
            document.getElementById('r-sniper').textContent = sniper;
            document.getElementById('r-eiac').textContent = eiac + ' (Geral -4)';
            document.getElementById('r-m1014').textContent = m1014val + ' (Geral +10)';
            
            document.getElementById('caixaSensi').classList.add('mostrar');
            document.getElementById('caixaSensi').scrollIntoView({behavior:'smooth'});
        }
    </script>
</body>
</html>
